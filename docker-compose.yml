version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llmsheriff-backend
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:///./data/llmsheriff.db
      NIMOTRON_API_KEY: ${NIMOTRON_API_KEY:-}
      NIMOTRON_BASE_URL: ${NIMOTRON_BASE_URL:-https://integrate.api.nvidia.com/v1}
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./backend:/app
      - llmsheriff_data:/app/data
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llmsheriff-frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  llmsheriff_data:
